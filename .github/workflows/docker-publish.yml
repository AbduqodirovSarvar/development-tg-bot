name: CI/CD — Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish (default: latest)"
        required: false
        default: latest

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: development-tg-bot

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) BUILD-CHECK — kompilyatsiya xatosi bo'lsa keyingi joblar
  #    ishga tushmaydi. Test loyihasi hozircha yo'q, shuning uchun
  #    `dotnet test` qadami chiqarib tashlangan; loyihaga test
  #    qo'shilsa, shu yerga `dotnet test` qatorini qo'shing.
  # ─────────────────────────────────────────────────────────────
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore development-tg-bot.csproj

      - name: Build project
        run: dotnet build development-tg-bot.csproj --configuration Release --no-restore

  # ─────────────────────────────────────────────────────────────
  # 2) BUILD & PUSH — Docker image build qilib Docker Hub'ga push
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    needs: build-check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push ${{ env.IMAGE_NAME }}
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 3) DEPLOY — server'ga SSH qilib pull va up -d ishga tushiradi
  # ─────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH to server and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/svlab/development-tg-bot
            echo "▶ Pulling latest code..."
            git pull
            echo "▶ Pulling latest image..."
            docker compose pull
            echo "▶ Restarting containers..."
            docker compose up -d
            echo "▶ Cleaning up dangling images..."
            docker image prune -f
            echo "▶ Container status:"
            docker compose ps

  # ─────────────────────────────────────────────────────────────
  # 4) NOTIFY — har bir bosqich natijasini Telegram'ga yuborish.
  #    `if: always()` shu jobni avvalgi joblar muvaffaqiyatli yoki
  #    yiqilgan/cancelled/skipped bo'lganida ham ishga tushiradi.
  #    Notification post'ining o'zi xato bersa, workflow yashil
  #    qoladi (notification observability, deploy emas).
  # ─────────────────────────────────────────────────────────────
  notify:
    needs: [build-check, build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send CI/CD status to Telegram gateway
        env:
          GATEWAY_URL: ${{ secrets.NOTIFICATION_GATEWAY_URL }}
          API_KEY: ${{ secrets.NOTIFICATION_API_KEY_CICD }}
          PROJECT: development-tg-bot
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          BUILD_PUSH_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -uo pipefail

          if [ -z "$GATEWAY_URL" ] || [ -z "$API_KEY" ]; then
            echo "Gateway secrets not set; skipping notification."
            exit 0
          fi

          icon() {
            case "$1" in
              success)   echo "✅";;
              failure)   echo "❌";;
              cancelled) echo "⏹️";;
              skipped)   echo "⏭️";;
              *)         echo "❔";;
            esac
          }

          # Failure dominates; cancelled second. All-success only if every
          # job ended in `success` — anything else is "PARTIAL" so the
          # message clearly distinguishes a clean run from one with skips.
          if   [[ "$BUILD_CHECK_RESULT" == "failure" || "$BUILD_PUSH_RESULT" == "failure" || "$DEPLOY_RESULT" == "failure" ]]; then
            OVERALL="❌ FAILED"
          elif [[ "$BUILD_CHECK_RESULT" == "cancelled" || "$BUILD_PUSH_RESULT" == "cancelled" || "$DEPLOY_RESULT" == "cancelled" ]]; then
            OVERALL="⏹️ CANCELLED"
          elif [[ "$BUILD_CHECK_RESULT" == "success" && "$BUILD_PUSH_RESULT" == "success" && "$DEPLOY_RESULT" == "success" ]]; then
            OVERALL="✅ SUCCESS"
          else
            OVERALL="⚠️ PARTIAL"
          fi

          # Short SHA for readability — full SHA stays in the run URL below.
          SHORT_COMMIT="${COMMIT:0:7}"

          TEXT="$OVERALL — $PROJECT
          branch: $BRANCH
          commit: $SHORT_COMMIT
          author: $AUTHOR

          build-check: $(icon "$BUILD_CHECK_RESULT")  $BUILD_CHECK_RESULT
          build/push:  $(icon "$BUILD_PUSH_RESULT")  $BUILD_PUSH_RESULT
          deploy:      $(icon "$DEPLOY_RESULT")  $DEPLOY_RESULT

          https://github.com/$REPO/actions/runs/$RUN_ID"

          # jq escapes newlines/quotes safely so we never send malformed JSON.
          PAYLOAD=$(jq -n --arg text "$TEXT" '{destination: "familytree.dev.cicd", text: $text}')

          # Notification failure must not break the workflow — `|| true`
          # keeps the job green even if the gateway is unreachable.
          curl -sSf -X POST "$GATEWAY_URL/api/notify" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" || echo "Notification post failed (non-fatal)."
